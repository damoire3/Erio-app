name: Build APK
on:
  workflow_dispatch:
    inputs:
      widget:
        description: 'Ajouter le widget de citations'
        type: boolean
        default: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap init Erio com.eriomad.app300 --web-dir=dist
      - run: npx cap add android
      - run: npx cap sync android
      - name: Icone et ecran de demarrage
        continue-on-error: true
        run: python3 make_icons.py && npx @capacitor/assets generate --android --iconBackgroundColor '#0c0916' --iconBackgroundColorDark '#0c0916' --splashBackgroundColor '#0c0916' --splashBackgroundColorDark '#0c0916'
      - name: Sons des alarmes
        continue-on-error: true
        run: python3 make_sounds.py
      - name: Permissions et widget
        continue-on-error: true
        run: python3 android_patch.py
        env:
          WIDGET: ${{ inputs.widget }}
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Erio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
